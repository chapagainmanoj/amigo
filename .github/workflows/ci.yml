name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: amigo_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amigo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate migrations and tenant isolation
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d amigo_test \
            -f tests/sql/bootstrap_supabase_roles.sql \
            -f migrations/001_initial_schema.sql \
            -f migrations/002_auth_linking_and_rls.sql \
            -f migrations/003_secure_pairing_tokens.sql \
            -f migrations/004_tenant_isolation_policies.sql \
            -f tests/sql/seed_legacy_task_states.sql \
            -f migrations/005_canonical_task_command.sql \
            -f tests/sql/assert_canonical_task_backfill.sql \
            -f tests/sql/seed_legacy_reminders.sql \
            -f migrations/006_durable_reminder_outbox.sql \
            -f tests/sql/assert_reminder_backfill.sql \
            -f migrations/007_consistent_task_reminder_resolution.sql \
            -f migrations/008_atomic_later_command.sql \
            -f migrations/009_telegram_update_claims.sql \
            -f migrations/010_consistent_dashboard_snapshot.sql \
            -f tests/sql/tenant_isolation.sql \
            -f tests/sql/create_task_command.sql \
            -f tests/sql/reminder_outbox.sql \
            -f tests/sql/resolve_task_command.sql \
            -f tests/sql/apply_later_command.sql \
            -f tests/sql/telegram_update_claims.sql \
            -f tests/sql/dashboard_snapshot.sql \
            -f tests/sql/seed_legacy_reliability.sql \
            -f migrations/011_reminder_reliability_instrumentation.sql \
            -f tests/sql/reminder_reliability.sql \
            -f migrations/012_canonical_planning_day_move.sql \
            -f tests/sql/move_task_planning_day_command.sql \
            -f migrations/013_dashboard_first_activation.sql \
            -f tests/sql/activation_journey.sql \
            -f migrations/014_application_schema_version.sql \
            -f tests/sql/app_schema_version.sql

      - name: Prove the Activation functions cannot deadlock
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: amigo_test
          PGPASSWORD: postgres
          PGOPTIONS: "-c role=service_role"
        run: python scripts/check_activation_lock_order.py

      - name: Prove the schema-version gate cannot be faked in either direction
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: amigo_test
          PGPASSWORD: postgres
        run: python scripts/check_schema_chain.py

      - name: Lint
        run: ruff check src tests scripts

      - name: Validate Gate A evaluation contract
        run: python scripts/run_gate_a_eval.py --validate-only

      - name: Test
        run: python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
