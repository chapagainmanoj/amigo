# fly.toml app configuration file generated for amigo on 2026-06-27T16:25:51+05:45
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'amigo'
primary_region = 'bom'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_BASE_URL = 'https://amigo.fly.dev'
  APP_CHANNEL = 'telegram'
  APP_ENV = 'production'
  LOG_LEVEL = 'INFO'

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[services.http_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'get'
    path = '/health'
    protocol = 'http'
    tls_skip_verify = false

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
